name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      # Builds the crate; crane runs `cargo test` in the build.
      - run: nix build -L .#checks.${{ matrix.system }}.package
