name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      # Substitutes from burk3.cachix.org; on pushes to master, also uploads
      # everything built in this job.
      - uses: cachix/cachix-action@v17
        with:
          name: burk3
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      # Builds the crate (the same derivation as packages.default); crane runs
      # `cargo test` in the build.
      - run: nix build -L .#checks.${{ matrix.system }}.package

  flakehub-rolling:
    name: Publish rolling version to FlakeHub
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # FlakeHub authenticates with the workflow's OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the rolling version counts commits
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      - uses: DeterminateSystems/flakehub-push@v7
        with:
          visibility: public
          rolling: true
          # 0.0.<commit count>: tagged releases (v0.1.0 and up) always sort
          # above master builds, so `…/0.1` only resolves to tags.
          rolling-minor: 0
