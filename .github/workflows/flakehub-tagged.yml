name: Publish tags to FlakeHub

on:
  push:
    tags:
      - v?[0-9]+.[0-9]+.[0-9]+*
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish to FlakeHub
        type: string
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build and cache (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Check the tag matches Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "${TAG#v}" != "$crate" ]; then
            echo "tag $TAG does not match Cargo.toml version $crate" >&2
            exit 1
          fi
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      - uses: cachix/cachix-action@v17
        with:
          name: burk3
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build -L .#checks.${{ matrix.system }}.package

  flakehub-publish:
    name: Publish to FlakeHub
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      - uses: DeterminateSystems/flakehub-push@v7
        with:
          visibility: public
          tag: ${{ env.TAG }}
