[package]
name = "nix-exporter"
version = "0.1.0"
edition = "2021"
description = "Prometheus exporter for the Nix store and daemon"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dns-lookup = "4"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
